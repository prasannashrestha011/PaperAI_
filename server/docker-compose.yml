services:
  db:
    image: postgres:15
    container_name: my_postgres_db 
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 9843
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: my_graph_db
    environment:
      NEO4J_AUTH: neo4j/9843
    ports:
      - "7474:7474"
    volumes:
      - neo4jdata:/data

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
    command: server /data
    volumes:
      - miniodata:/data
  redis:
    image: redis:7-alpine
    container_name: my_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes


volumes:
  pgdata:
  neo4jdata:
  miniodata: 
  redisdata:
